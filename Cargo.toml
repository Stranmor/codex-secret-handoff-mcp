[package]
name = "codex-secret-handoff-mcp"
version = "0.1.0"
edition = "2024"
description = "Local MCP server for secret handoff through the OS keyring without exposing plaintext to model context"
license = "MIT"
repository = "https://github.com/Stranmor/codex-secret-handoff-mcp"
readme = "README.md"

# Standalone workspace root: without this table a parent directory that happens
# to contain a Cargo workspace (e.g. the shared remote build root) adopts this
# crate and its members are then resolved instead of ours.
[workspace]

[dependencies]
fs2 = "*"
libc = "*"
rmcp = { version = "*", features = ["schemars", "transport-io"] }
schemars = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
tokio = { version = "*", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "*"
uuid = { version = "*", features = ["v4"] }
zeroize = "*"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
